name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Build frontend
        run: npm --prefix frontend ci && npm --prefix frontend run build
      - name: Check backend loads
        run: |
          npm --prefix backend ci
          cd backend
          SUPABASE_URL=https://example.supabase.co SUPABASE_SERVICE_ROLE_KEY=ci node -e "require('./routes/rootedRoutes'); console.log('backend routes load')"
