services:
  - type: web
    name: rooted
    runtime: node
    plan: free
    buildCommand: npm --prefix backend install && npm --prefix frontend install && npm --prefix frontend run build
    startCommand: node backend/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_WRITES
        value: "false"
      - key: MONGO_URI
        sync: false
      - key: CORS_ORIGIN
        value: ""
